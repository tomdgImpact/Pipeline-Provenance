[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-provenance"
version = "0.1.0.dev0"
description = "Supply-chain hardening for CI/CD: four enforced invariants, signed provenance, and an audit CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Tom Durand-Gasselin" }]
keywords = ["supply-chain", "slsa", "provenance", "sbom", "ci-cd", "sigstore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
]

[project.optional-dependencies]
remote = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "playwright>=1.45",
]

[project.scripts]
ppv = "pipeline_provenance.cli:main"

[project.urls]
Homepage = "https://github.com/tomdgImpact/Pipeline-Provenance"
Source = "https://github.com/tomdgImpact/Pipeline-Provenance"
Issues = "https://github.com/tomdgImpact/Pipeline-Provenance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_provenance"]

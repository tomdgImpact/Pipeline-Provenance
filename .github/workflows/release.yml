name: release

# Builds, attests and publishes a tagged release through the same controls the
# project sells. If this workflow cannot satisfy them, neither can anyone
# adopting them, and the project would be arguing against itself.

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: policy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      # The release gates on the project's own tool. An accepted exception is
      # argued in docs/THREAT_MODEL.md section 9; unverified checks are
      # permitted here and only here, because this repository owns no admission
      # point — its consumers do.
      - run: uv run ppv gate . --fail-on high --allow-unverified

  build:
    name: build and attest
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv build

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.whl

      # Atomic: a release that carries one document without the other is not a
      # weaker release, it is a useless one.
      - name: Fail unless the attestation set is complete
        run: |
          test -s dist/sbom.cdx.json || {
            echo "::error::SBOM missing; the attestation set is atomic."
            exit 1
          }
          ls dist/*.whl >/dev/null || {
            echo "::error::no wheel produced."
            exit 1
          }

      # Advisory only. This runs inside the build job, which the threat model
      # treats as untrusted. The decision belongs at the consumer's admission
      # point (ADR-0004).
      - name: Advisory note
        run: |
          echo "::notice title=Advisory::Verify at your admission point." \
               "Build-time verification proves nothing (ADR-0004)."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
          retention-days: 90

name: hardened-build

# A reusable workflow implementing the four invariants. Call it from another
# repository:
#
#   jobs:
#     build:
#       uses: tomdgImpact/Pipeline-Provenance/.github/workflows/hardened-build.yml@f9ac3f27c8c3d4ee2853b3d0038ce7347228fc9a # v0.1.1
#       with:
#         allowed-endpoints: "pypi.org:443 files.pythonhosted.org:443"
#         build-command: "python -m build"
#         artifact-path: "dist/*"
#       permissions:
#         contents: read
#         id-token: write
#         attestations: write
#
# Migration path: docs/MIGRATION.md.

on:
  workflow_call:
    inputs:
      allowed-endpoints:
        description: Hosts this build may reach. Everything else is refused.
        required: true
        type: string
      build-command:
        description: The command that produces the artifact.
        required: true
        type: string
      artifact-path:
        description: Glob for the produced artifact.
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: ubuntu-24.04
      fail-on:
        description: Lowest severity that fails the policy gate.
        required: false
        type: string
        default: low

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Gate first, in its own job. Nothing third-party has executed at this point,
  # which is the only position from which a gate can constrain what runs next.
  # ---------------------------------------------------------------------------
  policy-gate:
    name: policy gate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/egress-guard
        with:
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/policy-gate
        with:
          fail-on: ${{ inputs.fail-on }}

  # ---------------------------------------------------------------------------
  # Hermetic build. No ambient long-lived credentials, egress denied by default,
  # and it does not start unless the gate passed.
  #
  # This job runs `inputs.build-command`, which is arbitrary code supplied by
  # the caller. It therefore holds NO signing scope. GitHub exposes
  # ACTIONS_ID_TOKEN_REQUEST_TOKEN to every step of a job that has
  # `id-token: write`, so a job that both runs caller-supplied code and holds
  # that scope lets the build mint an attestation under this workflow's
  # identity — threat model T-13, built by our own hand. The split below is the
  # structural fix; a warning in the documentation would not have been one.
  # ---------------------------------------------------------------------------
  build:
    name: hermetic build
    needs: [policy-gate]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/egress-guard
        with:
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build
        run: ${{ inputs.build-command }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unattested-build-output
          path: ${{ inputs.artifact-path }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Attestation, in a job that runs no caller-supplied code. Its only inputs are
  # the artifact produced above and actions pinned by digest, so the signing
  # identity is not reachable from anything the caller controls.
  # ---------------------------------------------------------------------------
  attest:
    name: attest
    needs: [build]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: ./.github/actions/egress-guard
        with:
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unattested-build-output
          path: dist

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      # The attestation set is atomic: half of it is not a weaker guarantee, it
      # is a different and useless one.
      - name: Fail unless both attestation documents exist
        run: |
          test -s sbom.cdx.json || {
            echo "::error::SBOM missing. The attestation set is atomic."
            exit 1
          }

      # Advisory only. This runs inside CI, not at the admission point, so it
      # shortens the feedback loop and proves nothing (ADR-0004). The decision
      # belongs to whoever consumes the artifact.
      - name: Advisory note
        run: |
          echo "::notice title=Advisory::Verify at your admission point." \
               "Build-time verification proves nothing (ADR-0004)."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: |
            dist
            sbom.cdx.json
          retention-days: 14

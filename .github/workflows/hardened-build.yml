name: hardened-build

# A reusable workflow implementing the four invariants. Call it from another
# repository:
#
#   jobs:
#     build:
#       uses: tomdgImpact/Pipeline-Provenance/.github/workflows/hardened-build.yml@v0.1.0
#       with:
#         allowed-endpoints: "pypi.org:443 files.pythonhosted.org:443"
#         build-command: "python -m build"
#         artifact-path: "dist/*"
#       permissions:
#         contents: read
#         id-token: write
#         attestations: write
#
# Migration path: docs/MIGRATION.md.

on:
  workflow_call:
    inputs:
      allowed-endpoints:
        description: Hosts this build may reach. Everything else is refused.
        required: true
        type: string
      build-command:
        description: The command that produces the artifact.
        required: true
        type: string
      artifact-path:
        description: Glob for the produced artifact.
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: ubuntu-24.04
      fail-on:
        description: Lowest severity that fails the policy gate.
        required: false
        type: string
        default: low

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Gate first, in its own job. Nothing third-party has executed at this point,
  # which is the only position from which a gate can constrain what runs next.
  # ---------------------------------------------------------------------------
  policy-gate:
    name: policy gate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/egress-guard
        with:
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/policy-gate
        with:
          fail-on: ${{ inputs.fail-on }}

  # ---------------------------------------------------------------------------
  # Hermetic build. No ambient long-lived credentials, egress denied by default,
  # and it does not start unless the gate passed.
  # ---------------------------------------------------------------------------
  build:
    name: hermetic build
    needs: [policy-gate]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: ./.github/actions/egress-guard
        with:
          allowed-endpoints: ${{ inputs.allowed-endpoints }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build
        run: ${{ inputs.build-command }}

      # -----------------------------------------------------------------------
      # Attestation. Provenance and SBOM are emitted together; a build that
      # produces one without the other fails, because a consumer's policy needs
      # both to answer both questions.
      # -----------------------------------------------------------------------
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ inputs.artifact-path }}
      - name: Fail unless both attestation documents exist
        run: |
          test -s sbom.cdx.json || {
            echo "::error::SBOM missing. The attestation set is atomic."
            exit 1
          }
      # Advisory only. This runs inside the build job — the untrusted execution
      # context the whole design assumes is compromised — so it shortens the
      # feedback loop and proves nothing. The decision is made at the admission
      # point (ADR-0004), which is the consumer's, not ours.
      - name: Advisory attestation check
        run: |
          echo "::notice title=Advisory::Build-time verification proves nothing;" \
               "the decision belongs at the admission point (ADR-0004)."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: |
            ${{ inputs.artifact-path }}
            sbom.cdx.json
          retention-days: 14

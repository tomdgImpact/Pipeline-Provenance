name: ci

# Every gate in this file is blocking. There is no advisory step: a check that
# cannot fail the build is a dashboard, not a control.
#
# Every third-party action is pinned to an immutable commit SHA with the
# human-readable version in a trailing comment. The comment is ours; the tag
# belongs to the publisher and can be repointed at any time (ADR-0001).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny by default at the top level. Each job re-declares exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PPV_ALLOW_NETWORK: "0"

jobs:
  static:
    name: lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev,remote]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  unit:
    name: unit and end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev,remote]"
      - name: Unit and end-to-end suites
        run: pytest -m "not security and not demo and not gui" --cov --cov-report=term-missing

  adversarial:
    name: adversarial corpus (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]"
      - name: Run the adversarial suite
        run: pytest -m security --junitxml=adversarial.xml
      - name: Assert the suite was non-empty and nothing was skipped
        if: always()
        run: python scripts/assert_suite_ran.py adversarial.xml 1

  # The browser gate lands with the HTML renderer (T015) and its Playwright
  # suite (T016). It is deliberately absent until then: a job that runs an
  # empty selection would report green while covering nothing, which is the
  # failure mode `scripts/assert_suite_ran.py` exists to prevent.

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev,remote]"
      - run: pip-audit --strict --progress-spinner=off

  sast:
    name: static application security testing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]" semgrep
      - name: bandit
        run: bandit -c pyproject.toml -r src -ll
      - name: semgrep
        run: semgrep scan --error --config policy/semgrep --sarif --output semgrep.sarif src
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: filesystem vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  gate:
    name: all gates green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs: [static, unit, adversarial, dependencies, sast, secrets, filesystem]
    if: always()
    steps:
      - name: Fail unless every gate succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more gates did not succeed."
            exit 1
          fi
          echo "All gates green."

name: ci

# Every gate in this file is blocking. There is no advisory step: a check that
# cannot fail the build is a dashboard, not a control.
#
# Every third-party action is pinned to an immutable commit SHA with the
# human-readable version in a trailing comment. The comment is ours; the tag
# belongs to the publisher and can be repointed at any time (ADR-0001).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-running a run replays the original run's context, including the
  # repository visibility recorded at the time. A control whose enforcement
  # depends on that — the egress policy does — therefore cannot be re-tested by
  # a rerun. This lets a fresh run be triggered without an empty commit.
  workflow_dispatch:

# Deny by default at the top level. Each job re-declares exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PPV_ALLOW_NETWORK: "0"

jobs:
  static:
    name: lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: unit and end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      - name: Unit and end-to-end suites
        run: uv run pytest -m "not security and not demo and not gui" --cov --cov-report=term-missing

  adversarial:
    name: adversarial corpus (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      - name: Run the adversarial suite
        run: uv run pytest -m security --junitxml=adversarial.xml
      - name: Assert the suite was non-empty and nothing was skipped
        if: always()
        run: uv run python scripts/assert_suite_ran.py adversarial.xml 1

  browser:
    name: html report interface
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            cdn.playwright.dev:443
            playwright.azureedge.net:443
            storage.googleapis.com:443
            playwright.download.prss.microsoft.com:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      # cdn.playwright.dev redirects: Chrome for Testing builds come from
      # storage.googleapis.com and ffmpeg from playwright.download.prss.
      # microsoft.com, so both hops have to be allowlisted, not just the first.
      #
      # No --with-deps: it runs apt-get update, which queries every APT source
      # on the runner image, including packages.microsoft.com and dl.google.com.
      # Widening the allowlist so an unnecessary step can succeed is how an
      # egress policy becomes decorative. The ubuntu-24.04 image already carries
      # the libraries Playwright's chromium needs.
      - run: uv run python -m playwright install chromium
      - name: Browser suite
        run: uv run pytest -m gui --junitxml=gui.xml
      # The report itself is asserted to make no outbound request; the suite
      # aborts every non-file:// request the page attempts, so a report that
      # grows an external reference fails here rather than passing on a machine
      # that happened to have network access.
      - name: Assert the browser suite was non-empty and nothing was skipped
        if: always()
        run: uv run python scripts/assert_suite_ran.py gui.xml 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  demonstration:
    name: supply-chain demonstration (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The allowlist deliberately omits every host the demonstration tries to
      # reach except loopback, so act three is enforced by the platform rather
      # than simulated by the test.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      - name: Run the three acts
        run: uv run pytest -m demo --junitxml=demo.xml
      - name: Assert the demonstration was non-empty and nothing was skipped
        if: always()
        run: uv run python scripts/assert_suite_ran.py demo.xml 3
      # The assertion above proves the payload behaves as described. This one
      # proves the runner actually refuses an unlisted host, which no test
      # running inside the job could establish on its own.
      - name: Prove egress denial is in force on this runner
        run: ./demo/prove_egress_denied.sh https://example.com

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      # Audited from the committed lockfile rather than from the installed
      # environment. The environment contains this project, which has no PyPI
      # record and would make --strict fail on us instead of on a dependency;
      # more importantly, the lockfile is the thing a build actually resolves.
      - run: uv export --no-emit-project --format requirements-txt --all-extras -o requirements.audit.txt
      - run: uv run pip-audit --strict --progress-spinner=off -r requirements.audit.txt

  sast:
    name: static application security testing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            semgrep.dev:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      # Pinned by version and installed as an isolated tool rather than as a
      # project dependency: semgrep is CI tooling, and putting it in the
      # lockfile would make every developer resolve it to run the tests.
      - run: uv tool install semgrep==1.174.0
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src -ll
      - name: semgrep
        run: semgrep scan --error --metrics=off --config policy/semgrep --sarif --output semgrep.sarif src
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: filesystem vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            ghcr.io:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  gate:
    name: all gates green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs:
      [static, unit, adversarial, browser, demonstration, dependencies, sast, secrets, filesystem]
    if: always()
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Fail unless every gate succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more gates did not succeed."
            exit 1
          fi
          echo "All gates green."

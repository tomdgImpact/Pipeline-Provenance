name: deploy

on:
  workflow_dispatch:

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            rekor.sigstore.dev:443
            fulcio.sigstore.dev:443
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Admission gate: nothing deploys without a valid attestation from the
      # expected identity. There is no permissive branch below this line.
      - run: gh attestation verify dist/app.whl --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
